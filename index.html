<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛집 & 주변 시설 검색 지도</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        .sidebar {
            width: 380px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .header {
            padding: 16px;
            background-color: #ffeb00;
            color: #3c1e1e;
        }
        .header h1 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 12px;
            opacity: 0.8;
        }
        .tab-group {
            display: flex;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #f1f3f5;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #228be6;
            border-bottom: 3px solid #228be6;
        }
        #placesList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .item {
            padding: 14px 16px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            background-color: #ffffff;
            transition: background-color 0.2s;
        }
        .item:hover {
            background-color: #e7f5ff;
        }
        .item h5 {
            font-size: 15px;
            color: #212529;
            margin-bottom: 4px;
        }
        .item .address {
            font-size: 13px;
            color: #666666;
            line-height: 1.4;
        }
        .item .phone {
            font-size: 12px;
            color: #2b8a3e;
            margin-top: 4px;
        }
        #map {
            flex: 1;
            height: 100%;
        }
        .info-window {
            padding: 10px 12px;
            font-size: 13px;
            min-width: 180px;
        }
        .info-window strong {
            display: block;
            color: #1c7ed6;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .info-window .info-addr {
            color: #495057;
            font-size: 12px;
            margin-bottom: 2px;
        }
        .info-window .info-phone {
            color: #2b8a3e;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h1>맛집 & 주변 시설 지도</h1>
                <p>맛집을 빠르게 찾기 위한 지도입니다.</p>
            </div>
            <!-- 기획서 3번에 맞춰 변경된 탭 2개 (대형마트 MT1, 학교 SC4) -->
            <div class="tab-group">
                <button class="tab-btn active" onclick="switchCategory('MT1', this)">🛒 대형마트</button>
                <button class="tab-btn" onclick="switchCategory('SC4', this)">🏫 학교</button>
            </div>
            <ul id="placesList"></ul>
        </div>

        <div id="map"></div>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=955d4144cbe385e4569d6bf62da15225&libraries=services&autoload=false"></script>

    <script>
        let map;
        let placesService;
        let infowindow;
        let markers = [];
        let userLocationMarker = null;
        let currentCenter;
        let currentCategoryCode = 'MT1'; // 기본값: 대형마트(MT1)

        kakao.maps.load(function () {
            const mapContainer = document.getElementById('map');
            const mapOptions = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567),
                level: 5
            };

            map = new kakao.maps.Map(mapContainer, mapOptions);
            placesService = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            initUserLocation();
        });

        function initUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        currentCenter = new kakao.maps.LatLng(lat, lng);

                        map.setCenter(currentCenter);
                        displayUserMarker(currentCenter);
                        searchPlacesByCategory(currentCategoryCode);
                    },
                    function (error) {
                        console.warn('위치 권한 오류. 기본 위치로 진행합니다.', error);
                        currentCenter = map.getCenter();
                        searchPlacesByCategory(currentCategoryCode);
                    }
                );
            } else {
                currentCenter = map.getCenter();
                searchPlacesByCategory(currentCategoryCode);
            }
        }

        function displayUserMarker(position) {
            if (userLocationMarker) {
                userLocationMarker.setMap(null);
            }

            userLocationMarker = new kakao.maps.Marker({
                position: position,
                map: map
            });

            kakao.maps.event.addListener(userLocationMarker, 'click', function () {
                infowindow.setContent('<div class="info-window"><strong>📍 내 현재 위치</strong></div>');
                infowindow.open(map, userLocationMarker);
            });
        }

        function switchCategory(categoryCode, element) {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            currentCategoryCode = categoryCode;
            searchPlacesByCategory(categoryCode);
        }

        function searchPlacesByCategory(categoryCode) {
            clearListAndMarkers();
            const centerPosition = map.getCenter();

            placesService.categorySearch(categoryCode, categorySearchCallback, {
                location: centerPosition,
                radius: 2000
            });
        }

        function categorySearchCallback(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('주변에 해당 장소가 없습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        function displayPlaces(places) {
            const listElement = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds();

            places.forEach((place, index) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);
                const marker = addMarker(placePosition);
                const itemElement = createListItem(index, place);

                bounds.extend(placePosition);

                (function (marker, placeData) {
                    kakao.maps.event.addListener(marker, 'click', function () {
                        displayInfowindow(marker, placeData);
                    });

                    itemElement.onclick = function () {
                        map.panTo(placePosition);
                        displayInfowindow(marker, placeData);
                    };
                })(marker, place);

                listElement.appendChild(itemElement);
            });
        }

        function addMarker(position) {
            const marker = new kakao.maps.Marker({
                position: position,
                map: map
            });
            markers.push(marker);
            return marker;
        }

        function clearListAndMarkers() {
            const listElement = document.getElementById('placesList');
            listElement.innerHTML = '';

            markers.forEach(marker => marker.setMap(null));
            markers = [];
        }

        function createListItem(index, place) {
            const el = document.createElement('li');
            el.className = 'item';

            let addressHtml = `<span>${place.address_name}</span>`;
            if (place.road_address_name) {
                addressHtml = `<span>${place.road_address_name}</span>`;
            }

            el.innerHTML = `
                <h5>${index + 1}. ${place.place_name}</h5>
                <div class="address">${addressHtml}</div>
                ${place.phone ? `<div class="phone">📞 ${place.phone}</div>` : ''}
            `;

            return el;
        }

        function displayInfowindow(marker, place) {
            const content = `
                <div class="info-window">
                    <strong>${place.place_name}</strong>
                    <div class="info-addr">${place.road_address_name || place.address_name}</div>
                    ${place.phone ? `<div class="info-phone">📞 ${place.phone}</div>` : ''}
                </div>
            `;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }
    </script>
</body>
</html>
