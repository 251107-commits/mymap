<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색</title>
    <style>
        /* 기본 스타일 리셋 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* 메인 컨테이너: 좌/우 2분할 레이아웃 */
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽 사이드바 (검색창 + 검색 결과 리스트) */
        .sidebar {
            width: 380px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 검색 입력 박스 영역 */
        .search-box {
            padding: 16px;
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
        }
        .search-box form {
            display: flex;
            gap: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus {
            border-color: #ffeb00;
        }
        .search-box button {
            padding: 10px 16px;
            background-color: #ffeb00;
            border: 1px solid #e5d300;
            border-radius: 4px;
            font-weight: bold;
            color: #3c1e1e;
            cursor: pointer;
        }
        .search-box button:hover {
            background-color: #f5e100;
        }

        /* 검색 결과 목록 리스트 */
        #placesList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .item {
            padding: 14px 16px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            background-color: #ffffff;
            transition: background-color 0.2s;
        }
        .item:hover {
            background-color: #f1f3f5;
        }
        .item h5 {
            font-size: 15px;
            color: #212529;
            margin-bottom: 4px;
        }
        .item .address {
            font-size: 13px;
            color: #666666;
            line-height: 1.4;
        }
        .item .phone {
            font-size: 12px;
            color: #2b8a3e;
            margin-top: 4px;
        }

        /* 페이지 번호 영역 */
        #pagination {
            padding: 12px;
            text-align: center;
            background-color: #
