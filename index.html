<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 주변 맛집 & 카페 지도</title>
    <style>
        /* 기본 스타일 리셋 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* 메인 컨테이너: 좌/우 2분할 레이아웃 */
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽 사이드바 */
        .sidebar {
            width: 380px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 헤더 영역 */
        .header {
            padding: 16px;
            background-color: #ffeb00;
            color: #3c1e1e;
        }
        .header h1 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 12px;
            opacity: 0.8;
        }

        /* 카테고리 탭 버튼 영역 */
        .tab-group {
            display: flex;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #f1f3f5;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #228be6;
            border-bottom: 3px solid #228be6;
        }

        /* 검색 결과 목록 리스트 */
        #placesList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .item {
            padding: 14px 16px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            background-color: #ffffff;
            transition: background-color 0.2s;
        }
        .item:hover {
            background-color: #e7f5ff;
        }
        .item h5 {
            font-size: 15px;
            color: #212529;
            margin-bottom: 4px;
        }
        .item .address {
            font-size: 13px;
            color: #666666;
            line-height: 1.4;
        }
        .item .phone {
            font-size: 12px;
            color: #2b8a3e;
            margin-top: 4px;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 인포윈도우 팝업 스타일 */
        .info-window {
            padding: 10px 12px;
            font-size: 13px;
            min-width: 180px;
        }
        .info-window strong {
            display: block;
            color: #1c7ed6;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .info-window .info-addr {
            color: #495057;
            font-size: 12px;
            margin-bottom: 2px;
        }
        .info-window .info-phone {
            color: #2b8a3e;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 왼쪽 영역: 탭 및 리스트 -->
        <div class="sidebar">
            <div class="header">
                <h1>학교 주변 맛집 & 카페</h1>
                <p>내 주변의 맛집과 카페를 쉽게 찾아보세요!</p>
            </div>
            <div class="tab-group">
                <button class="tab-btn active" onclick="switchCategory('FD6', this)">🍕 맛집</button>
                <button class="tab-btn" onclick="switchCategory('CE7', this)">☕ 카페</button>
            </div>
            <ul id="placesList"></ul>
        </div>

        <!-- 오른쪽 영역: 카카오 지도 -->
        <div id="map"></div>
    </div>

    <!-- 카카오 지도 JavaScript SDK (autoload=false 적용) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=955d4144cbe385e4569d6bf62da15225&libraries=services&autoload=false"></script>

    <script>
        // 전역 변수 선언
        let map;
        let placesService;
        let infowindow;
        let markers = [];
        let userLocationMarker = null;
        let currentCenter;
        let currentCategoryCode = 'FD6'; // 기본값: 맛집(FD6)

        // 지도가 안전하게 로드된 후 실행
        kakao.maps.load(function () {
            const mapContainer = document.getElementById('map');
            
            // 지도 초기 설정 (기본 좌표: 서울시청, 확대 레벨: 5)
            const mapOptions = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567),
                level: 5
            };

            // 지도 및 서비스 객체 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);
            placesService = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 사용자 현재 위치 파악 후 카테고리 검색 수행
            initUserLocation();
        });

        // 현재 위치를 구하는 함수
        function initUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        currentCenter = new kakao.maps.LatLng(lat, lng);

                        // 지도 중심을 현재 위치로 이동
                        map.setCenter(currentCenter);

                        // 현재 위치 마커 표시
                        displayUserMarker(currentCenter);

                        // 현재 위치 기준으로 장소 검색 실행
                        searchPlacesByCategory(currentCategoryCode);
                    },
                    function (error) {
                        console.warn('위치 권한을 얻지 못했습니다. 기본 위치로 진행합니다.', error);
                        currentCenter = map.getCenter();
                        searchPlacesByCategory(currentCategoryCode);
                    }
                );
            } else {
                currentCenter = map.getCenter();
                searchPlacesByCategory(currentCategoryCode);
            }
        }

        // 현재 위치를 알리는 전용 마커 표시 함수
        function displayUserMarker(position) {
            if (userLocationMarker) {
                userLocationMarker.setMap(null);
            }

            userLocationMarker = new kakao.maps.Marker({
                position: position,
                map: map
            });

            // 내 위치 마커 클릭 시 팝업
            kakao.maps.event.addListener(userLocationMarker, 'click', function () {
                infowindow.setContent('<div class="info-window"><strong>📍 내 현재 위치</strong></div>');
                infowindow.open(map, userLocationMarker);
            });
        }

        // 탭 클릭 시 카테고리 전환 함수
        function switchCategory(categoryCode, element) {
            // 버튼 활성화 스타일 전환
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            currentCategoryCode = categoryCode;
            searchPlacesByCategory(categoryCode);
        }

        // 카테고리 코드로 장소 검색 요청 함수
        function searchPlacesByCategory(categoryCode) {
            // 기존 마커 및 목록 제거
            clearListAndMarkers();

            const centerPosition = map.getCenter();

            // 카테고리 검색 API 호출 (중심 좌표 기준 반경 2km 이내)
            placesService.categorySearch(categoryCode, categorySearchCallback, {
                location: centerPosition,
                radius: 2000
            });
        }

        // 카테고리 검색 결과를 받는 콜백 함수
        function categorySearchCallback(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('주변에 해당 장소가 없습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 검색된 장소를 마커와 목록으로 출력하는 함수
        function displayPlaces(places) {
            const listElement = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds();

            places.forEach((place, index) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);

                // 장소 마커 생성
                const marker = addMarker(placePosition);

                // 목록 엘리먼트 생성
                const itemElement = createListItem(index, place);

                bounds.extend(placePosition);

                // 이벤트 등록 (마커/리스트 클릭 시 상세 팝업 표시)
                (function (marker, placeData) {
                    kakao.maps.event.addListener(marker, 'click', function () {
                        displayInfowindow(marker, placeData);
                    });

                    itemElement.onclick = function () {
                        map.panTo(placePosition);
                        displayInfowindow(marker, placeData);
                    };
                })(marker, place);

                listElement.appendChild(itemElement);
            });
        }

        // 마커 생성 함수
        function addMarker(position) {
            const marker = new kakao.maps.Marker({
                position: position,
                map: map
            });
            markers.push(marker);
            return marker;
        }

        // 목록 및 마커 초기화 함수
        function clearListAndMarkers() {
            const listElement = document.getElementById('placesList');
            listElement.innerHTML = '';

            markers.forEach(marker => marker.setMap(null));
            markers = [];
        }

        // 목록 항목 생성 함수
        function createListItem(index, place) {
            const el = document.createElement('li');
            el.className = 'item';

            let addressHtml = `<span>${place.address_name}</span>`;
            if (place.road_address_name) {
                addressHtml = `<span>${place.road_address_name}</span>`;
            }

            el.innerHTML = `
                <h5>${index + 1}. ${place.place_name}</h5>
                <div class="address">${addressHtml}</div>
                ${place.phone ? `<div class="phone">📞 ${place.phone}</div>` : ''}
            `;

            return el;
        }

        // 상세정보 팝업(인포윈도우) 표시 함수
        function displayInfowindow(marker, place) {
            const content = `
                <div class="info-window">
                    <strong>${place.place_name}</strong>
                    <div class="info-addr">${place.road_address_name || place.address_name}</div>
                    ${place.phone ? `<div class="info-phone">📞 ${place.phone}</div>` : ''}
                </div>
            `;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }
    </script>
</body>
</html>
